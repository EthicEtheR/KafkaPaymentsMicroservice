spring.application.name=TransferService

server.port=0

spring.kafka.producer.bootstrap-servers=localhost:9092,localhost:9094

#producer config
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all

##no of retries after a send fail
#spring.kafka.producer.retries=10
##wait time after sending retry msg
#spring.kafka.producer.properties.retry.backoff.ms=1000

#total retry time
spring.kafka.producer.properties.delivery.timeout.ms=120000
#wait time for other msg to come for batch send
spring.kafka.producer.properties.linger.ms=0

spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.per.connection=5

deposit.money.topic=deposit-money-topic
withdraw.money.topic=withdraw-money-topic

#Transaction configs
spring.kafka.producer.transaction-id-prefix=transfer-service-${random.uuid}-

logging.level.org.springframework.kafka.transaction=TRACE
logging.level.org.springframework.transaction=TRACE

