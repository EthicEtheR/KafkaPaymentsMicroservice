spring.application.name=TransferService

server.port=0

spring.kafka.producer.bootstrap-servers=localhost:9092,localhost:9094

#producer config
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all

##no of retries after a send fail
#spring.kafka.producer.retries=10
##wait time after sending retry msg
#spring.kafka.producer.properties.retry.backoff.ms=1000

#total retry time
spring.kafka.producer.properties.delivery.timeout.ms=120000
#wait time for other msg to come for batch send
spring.kafka.producer.properties.linger.ms=0

spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.per.connection=5

deposit.money.topic=deposit-money-topic
withdraw.money.topic=withdraw-money-topic

#Transaction configs
spring.kafka.producer.transaction-id-prefix=transfer-service-${random.uuid}-

#for logging level
logging.level.org.springframework.kafka.transaction.KafkaTransactionManager=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
logging.level.org.apache.kafka.clients.producer.internals.TransactionManager=DEBUG


#DB config
spring.datasource.url=jdbc:h2:mem:testDb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
